# Checks that need no ROM (architecture §8.6, D30). ROMs never reach CI: the real tier runs locally
# and CI checks the provenance of its committed artifact, from phase 1 on. Each phase adds its steps
# here in the commit that makes them pass (the ci-tier gates, determinism and regression runs).
#
# Phase 2 adds: `bench regression` against the merge-base (the full history is fetched so that
# `git merge-base origin/main HEAD` resolves), the determinism run of the synthetic-tier analysis with a
# varied environment and another working directory, and one file of synthetic-tier analysis digests per
# job (bench/tools/ci-digests.ts), which the final job compares across both Node versions. Every job runs on
# Linux (D108).
#
# Phase 3 adds the tree digest per fixture to the same file (ci-digests@2: the digest g3.tree-determinism
# computes of the tree emitted from the discover model), so the varied-environment run and the final job
# compare the emitted trees too.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    runs-on: ubuntu-latest
    steps:
      # The whole history: bench regression's default base is `git merge-base origin/main HEAD`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install binutils (apt)
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      # @match-kit/decomp-yaml declares node >=24, so Node 22.18 prints EBADENGINE as a warning only.
      - name: Install exactly the lock file
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit, golden, architecture, mutation; includes the no-ROM-tracked check)
        run: npm test
      - name: Gates of every landed phase, ci tier
        run: npm run bench -- gates --require "$(node -p "require('./test/gates/phase.json').landed")" --tier ci
      - name: Regression against the merge-base with main
        run: npm run bench -- regression
      - name: Synthetic-tier analysis and tree digests
        run: node --conditions=source bench/tools/ci-digests.ts > "$RUNNER_TEMP/ci-digests.json"
      # The same analysis and tree digests from another working directory, in another time zone and locale,
      # must be the same bytes (the ci tiers of g2.determinism and g3.tree-determinism run the same way).
      - name: Determinism with a varied environment and another working directory
        env:
          TZ: Pacific/Kiritimati
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere/second run"
          cd "$RUNNER_TEMP/elsewhere/second run"
          node --conditions=source "$GITHUB_WORKSPACE/bench/tools/ci-digests.ts" > varied.json
          cmp "$RUNNER_TEMP/ci-digests.json" varied.json
      - name: Upload the analysis and tree digests
        uses: actions/upload-artifact@v4
        with:
          name: ci-digests-node-${{ matrix.node }}
          path: ${{ runner.temp }}/ci-digests.json
          if-no-files-found: error
          retention-days: 7

  digests:
    name: Analysis and tree digests agree across both Node versions
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exactly the lock file
        run: npm ci --ignore-scripts
      # Each artifact lands in its own directory, named after it.
      - name: Download every job's digests
        uses: actions/download-artifact@v4
        with:
          pattern: ci-digests-*
          path: ${{ runner.temp }}/digests
      - name: Compare the two digest files
        run: node --conditions=source bench/tools/ci-digests.ts --compare "$RUNNER_TEMP"/digests/*/ci-digests.json --expect 2
